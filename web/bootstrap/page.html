<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .success-badge {
            color: #01E0AB;
            background-color: #E2F7F2;
        }

        .danger-badge {
            color: #EC4565;
            background-color: #F7E6EA;
        }

        .warning-badge {
            color: #FF9B00;
            background-color: #FEEFCD;
        }
    </style>

</head>

<body>

    <div class="container">
        <div class="my-4 d-flex justify-content-between">
            <h2>Add Person Data</h2>
            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
                Add Data
            </button>
            <!-- Modal -->
            <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
                aria-labelledby="staticBackdropLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="staticBackdropLabel">Modal title</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            ...
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="button" class="btn btn-primary">Understood</button>
                        </div>
                    </div>
                </div>
            </div> 
            <!-- Modal end -->
        </div>
        <hr>
        <div class="card" style="width: 18rem;">
            <img src="../assets/images/pexels-shattha-pilabut-135620.jpg" class="card-img-left" alt="...">
            <div class="card-body">
                <h5 class="card-title">Card title</h5>
                <p class="card-text">Some quick example text to build on the card title and make up the bulk of the
                    card’s content.</p>

                <span class="badge success-badge">Makeup</span>
                <span class="badge success-badge">Shoes</span>
                <span class="badge success-badge">Hand Bag</span>
            </div>
        </div>
        <hr>
        <table class="table table-responsive table-bordered">
            <thead class="table-light">
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">First</th>
                    <th scope="col">Last</th>
                    <th scope="col">Email</th>
                    <th scope="col">Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">1</th>
                    <td>Mark</td>
                    <td>Otto</td>
                    <td>mark@gmail.com</td>
                    <td><span class="badge success-badge">Active</span></td>
                </tr>
                <tr>
                    <th scope="row">2</th>
                    <td>Jacob</td>
                    <td>Thornton</td>
                    <td>jacob@gmail.com</td>
                    <td><span class="badge danger-badge">Inactive</span></td>
                </tr>
                <tr>
                    <th scope="row">3</th>
                    <td>John</td>
                    <td>Doe</td>
                    <td>john@gmail.com</td>
                    <td><span class="badge warning-badge">Pending</span></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
