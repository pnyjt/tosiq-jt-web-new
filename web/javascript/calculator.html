<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <input type="text" id="display" readonly> <br> <br>

    <button onclick="clearDisplay()">Clear</button> <br>

    <button onclick="insertValue('/')"> &divide; </button>
    <button onclick="insertValue('7')">7</button>
    <button onclick="insertValue('8')">8</button>
    <button onclick="insertValue('9')">9</button> <br>
    <button onclick="insertValue('*')"> &times; </button>
    <button onclick="insertValue('4')">4</button>
    <button onclick="insertValue('5')">5</button>
    <button onclick="insertValue('6')">6</button> <br>
    <button onclick="insertValue('-')"> &minus; </button>
    <button onclick="insertValue('1')">1</button>
    <button onclick="insertValue('2')">2</button>
    <button onclick="insertValue('3')">3</button> <br>
    <button onclick="insertValue('+')"> &plus; </button>
    <button onclick="insertValue('0')">0</button>
    <button onclick="insertValue('.')">.</button>
    
    <button onclick="calculate()">=</button>


    <!-- js -->
    <script src="../assets/js/calculator.js"></script>
    
</body>
</html>
