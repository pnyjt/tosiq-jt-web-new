<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="form.css">
</head>

<body>
    <form class="p-4 row rounded shadow text-white">
        <h2 class="text-center">Signin to continue</h2>
        <div class="col-lg-6">
            <label for="">First name</label>
            <input type="text" class="form-control" placeholder="Name">
        </div>
        <div class="col-lg-6">
            <label for="">Last name</label>
            <input type="text" class="form-control" placeholder="Name">
        </div>
        <div class="col-lg-12">
            <label for="">Email</label>
            <input type="email" class="form-control" placeholder="Email">
        </div>
        <div class="col-lg-12">
            <label for="">Password</label>
            <input type="password" class="form-control" placeholder="Password">
        </div>
        <div class="col-lg-12 my-4">
            <input type="checkbox" id="terms" class="form-check-input terms">
            <label for="terms">I agreed to terms & conditions</label>
        </div>
        <div class="col-lg-12 text-center">
            <button type="submit" class="signin-btn w-50 btn">Signin</button>
        </div>
    </form>
    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
